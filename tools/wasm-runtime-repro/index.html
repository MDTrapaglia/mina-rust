<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Wasm Runtime Repro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        background: #101418;
        color: #d7e2ea;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        margin: 0;
        padding: 24px;
      }

      pre {
        background: #182028;
        border-radius: 8px;
        overflow: auto;
        padding: 16px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>Wasm runtime repro</h1>
    <pre id="result">running...</pre>
    <script type="module">
      const out = document.getElementById("result");
      const params = new URLSearchParams(window.location.search);

      const positiveInt = (name, fallback) => {
        const raw = Number(params.get(name) ?? String(fallback));
        return Number.isFinite(raw) && raw > 0 ? Math.round(raw) : fallback;
      };

      const optionalPositiveInt = name => {
        const raw = Number(params.get(name) ?? "");
        return Number.isFinite(raw) && raw > 0 ? Math.round(raw) : null;
      };

      const backend = params.get("backend") ?? "js_webcrypto";
      const wasmProfile = params.get("wasm_profile") ?? "threaded";
      const inputMode = params.get("input_mode") ?? "js_copy";
      const esmTarget = params.get("esm_target") ?? "trivial";
      const workerEntry = params.get("worker_entry") ?? "dynamic";
      const pageImportProbe = params.get("page_import_probe") ?? "none";
      const skipWorker = params.get("skip_worker") === "1";
      const sizeBytes = positiveInt("size_bytes", 3317098);
      const chunkSize = positiveInt("chunk_size", 16384);
      const yieldEveryChunks = positiveInt("yield_every_chunks", 4);
      const progressStep = positiveInt("progress_step", 1048576);
      const timeoutMs = positiveInt("timeout_ms", 60000);
      const forcedHardwareConcurrency =
        optionalPositiveInt("forced_hardware_concurrency");

      const result = {
        browser: {
          crossOriginIsolated: window.crossOriginIsolated,
          hardwareConcurrency: navigator.hardwareConcurrency,
          userAgent: navigator.userAgent,
        },
        config: {
          backend,
          wasmProfile,
          inputMode,
          esmTarget,
          workerEntry,
          pageImportProbe,
          skipWorker,
          sizeBytes,
          chunkSize,
          yieldEveryChunks,
          progressStep,
          timeoutMs,
          forcedHardwareConcurrency,
        },
        run: {
          state: "pending",
        },
        errors: [],
      };

      const importTargetRoot = target => {
        if (target === "single") {
          return "/tools/wasm-runtime-repro/pkg-single/wasm_runtime_repro.js";
        }
        if (target === "threaded") {
          return "/tools/wasm-runtime-repro/pkg/wasm_runtime_repro.js";
        }
        if (target === "trivial") {
          return "/tools/wasm-runtime-repro/probe-module.js";
        }
        throw new Error(`unsupported import target: ${target}`);
      };

      const workerEntryRoot = entry => {
        if (entry === "dynamic") {
          return "/tools/wasm-runtime-repro/runtime-worker.js";
        }
        if (entry === "static_trivial") {
          return "/tools/wasm-runtime-repro/runtime-worker-static-trivial.js";
        }
        if (entry === "static_single") {
          return "/tools/wasm-runtime-repro/runtime-worker-static-single.js";
        }
        throw new Error(`unsupported worker entry: ${entry}`);
      };

      const flush = () => {
        out.textContent = JSON.stringify(result, null, 2);
        console.log("RUNTIME_REPRO_RESULT", JSON.stringify(result));
      };

      const sendTrace = (stage, details = null) => {
        const query = new URLSearchParams({
          stage: `runtime-harness:${stage}`,
        });
        if (details !== null) {
          query.set("details", details);
        }
        fetch(`/wasm-smoke/trace?${query.toString()}`, {
          cache: "no-store",
        }).catch(() => undefined);
      };

      async function runPageImportProbe() {
        if (pageImportProbe === "none") {
          return;
        }
        const pkgRoot = importTargetRoot(pageImportProbe);
        sendTrace("page.import.begin", JSON.stringify({ pageImportProbe, pkgRoot }));
        const startedAt = performance.now();
        try {
          const module = await import(pkgRoot);
          result.pageImport = {
            state: "resolved",
            elapsedMs: Math.round(performance.now() - startedAt),
            pageImportProbe,
            pkgRoot,
            exportKeys: Object.keys(module).sort(),
          };
          sendTrace("page.import.complete", JSON.stringify(result.pageImport));
        } catch (error) {
          result.pageImport = {
            state: "failed",
            elapsedMs: Math.round(performance.now() - startedAt),
            pageImportProbe,
            pkgRoot,
            message:
              error instanceof Error ? error.stack ?? error.message : String(error),
          };
          sendTrace("page.import.error", JSON.stringify(result.pageImport));
          throw error;
        }
      }

      async function main() {
        await runPageImportProbe();

        if (skipWorker) {
          result.run = {
            state: "skipped",
          };
          sendTrace("page.skip_worker");
          flush();
          return;
        }

        const workerUrl = new URL(workerEntryRoot(workerEntry), window.location.origin);
        workerUrl.searchParams.set("backend", backend);
        workerUrl.searchParams.set("wasm_profile", wasmProfile);
        workerUrl.searchParams.set("input_mode", inputMode);
        workerUrl.searchParams.set("esm_target", esmTarget);
        workerUrl.searchParams.set("worker_entry", workerEntry);
        workerUrl.searchParams.set("size_bytes", String(sizeBytes));
        workerUrl.searchParams.set("chunk_size", String(chunkSize));
        workerUrl.searchParams.set(
          "yield_every_chunks",
          String(yieldEveryChunks),
        );
        workerUrl.searchParams.set("progress_step", String(progressStep));
        workerUrl.searchParams.set("timeout_ms", String(timeoutMs));
        if (forcedHardwareConcurrency !== null) {
          workerUrl.searchParams.set(
            "forced_hardware_concurrency",
            String(forcedHardwareConcurrency),
          );
        }

        sendTrace("page.start", JSON.stringify(result.config));
        const worker = new Worker(workerUrl, { type: "module" });

        const completion = new Promise(resolve => {
          worker.addEventListener("message", event => {
            resolve(event.data);
          });
          worker.addEventListener("error", event => {
            resolve({
              type: "error",
              message: event.message ?? "worker error",
              filename: event.filename ?? null,
              lineno: event.lineno ?? null,
              colno: event.colno ?? null,
            });
          });
          worker.addEventListener("messageerror", () => {
            resolve({
              type: "error",
              message: "worker messageerror",
            });
          });
        });
        worker.postMessage({ type: "start" });

        const startedAt = performance.now();
        const timeoutToken = Symbol("timeout");
        const outcome = await Promise.race([
          completion,
          new Promise(resolve => setTimeout(() => resolve(timeoutToken), timeoutMs)),
        ]);

        if (outcome === timeoutToken) {
          worker.terminate();
          result.run = {
            state: "timeout",
            elapsedMs: Math.round(performance.now() - startedAt),
            timeoutMs,
          };
          sendTrace("page.timeout", String(result.run.elapsedMs));
          flush();
          return;
        }

        worker.terminate();
        if (outcome?.type === "complete") {
          result.run = {
            state: "resolved",
            elapsedMs: outcome.elapsedMs,
            digestByteLength: outcome.digestByteLength,
            backend: outcome.backend,
            inputMode: outcome.inputMode,
          };
          sendTrace("page.complete", JSON.stringify(result.run));
        } else {
          result.run = {
            state: "failed",
            elapsedMs: Math.round(performance.now() - startedAt),
          };
          result.errors.push(outcome ?? { type: "error", message: "unknown error" });
          sendTrace("page.error", JSON.stringify(outcome ?? {}));
        }

        flush();
      }

      main().catch(error => {
        result.run = {
          state: "failed",
        };
        result.errors.push({
          type: "main",
          message: error instanceof Error ? error.stack ?? error.message : String(error),
        });
        flush();
      });

      flush();
    </script>
  </body>
</html>
